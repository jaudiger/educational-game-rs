name: Continuous Integration - Audit (Rust)

on:
  push:
    paths:
      - ".github/workflows/audit-rust.yml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/audit-rust.yml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: audit-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-rust:
    permissions:
      contents: read
      checks: write
    uses: jaudiger/reusable-workflows/.github/workflows/audit-rust.yml@33a0a8da94ca9d6eb9bebea0d3b86af989b883e4
