name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/*.rs'
              - '.cargo/**'
              - 'assets/**'
              - 'index.html'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  build-production:
    name: Build Production
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-rust.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec
    with:
      system-packages: "libasound2-dev libudev-dev libwayland-dev"

  build-demo:
    name: Build Demo
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-rust.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec
    with:
      features: demo
      system-packages: "libasound2-dev libudev-dev libwayland-dev"

  build-demo-wasm:
    name: Build Demo WASM
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-rust-trunk.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec

  lint-production:
    name: Lint Production
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-rust.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec
    with:
      all-features: false
      system-packages: "libasound2-dev libudev-dev libwayland-dev"

  lint-demo:
    name: Lint Demo
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-rust.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec
    with:
      all-features: false
      features: demo
      system-packages: "libasound2-dev libudev-dev libwayland-dev"

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec

  ci:
    if: always()
    needs:
      - build-production
      - build-demo
      - build-demo-wasm
      - lint-production
      - lint-demo
      - lint-actions
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
