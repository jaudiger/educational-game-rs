name: Package builds

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            package_name: educational-game-linux-x64
            package_layout: linux-tar-gz
            system_packages: "libasound2-dev libudev-dev libwayland-dev"
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            package_name: educational-game-linux-arm64
            package_layout: linux-tar-gz
            system_packages: "libasound2-dev libudev-dev libwayland-dev"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            package_name: educational-game-windows-x64
            package_layout: windows-zip
            system_packages: ""
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            package_name: educational-game-windows-arm64
            package_layout: windows-zip
            system_packages: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            package_name: educational-game-macos-arm64
            package_layout: macos-app-zip
            system_packages: ""

    uses: jaudiger/reusable-workflows/.github/workflows/package-rust-desktop.yml@33a0a8da94ca9d6eb9bebea0d3b86af989b883e4
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      binary-name: educational-game-rs
      package-name: ${{ matrix.package_name }}
      artifact-name: educational-game-${{ matrix.artifact }}-${{ github.sha }}
      package-layout: ${{ matrix.package_layout }}
      asset-directory: assets
      system-packages: ${{ matrix.system_packages }}
      macos-bundle-name: Educational Game
      macos-bundle-identifier: org.educational-game.rs
